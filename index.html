<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Sâu Ăn Táo Đơn Giản</title>
    <style>
        body { background-color: #222; color: #fff; text-align: center; font-family: sans-serif; }
        canvas { background-color: #111; border: 4px solid #00fff0; display: block; margin: 20px auto; }
        button { padding: 10px 20px; font-size: 18px; cursor: pointer; background: #00fff0; border: none; }
    </style>
</head>
<body>
    <h1>Sâu Ăn Táo</h1>
    <h2>Điểm: <span id="score">0</span></h2>
    <canvas id="game" width="400" height="400"></canvas>
    <button id="btn" style="display:none;" onclick="S()">Chơi Lại</button>

    <script>
        const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
        const scoreE = document.getElementById("score"), btn = document.getElementById("btn");
        let s, d, a, score, loop;

        function S() {
            s = [{x: 200, y: 200}]; d = "R"; score = 0; scoreE.innerText = score; btn.style.display = "none";
            T(); clearInterval(loop); loop = setInterval(U, 150);
        }
        function T() {
            a = { x: Math.floor(Math.random() * 20) * 20, y: Math.floor(Math.random() * 20) * 20 };
        }
        window.addEventListener("keydown", e => {
            if(e.keyCode==37 && d!="R") d="L"; if(e.keyCode==38 && d!="D") d="U";
            if(e.keyCode==39 && d!="L") d="R"; if(e.keyCode==40 && d!="U") d="D";
        });

        // Hàm vẽ quả táo đẹp giống ảnh bằng Canvas vector
        function drawApple(x, y, size) {
            let r = size / 2;
            let cx = x + r;
            let cy = y + r;

            // 1. Vẽ cuống táo (Màu nâu)
            ctx.beginPath();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#5d4037";
            ctx.quadraticCurveTo(cx, cy - r, cx + 4, cy - r - 6);
            ctx.stroke();

            // 2. Vẽ chiếc lá (Màu xanh lá có viền)
            ctx.beginPath();
            ctx.fillStyle = "#81c784";
            ctx.strokeStyle = "#2e7d32";
            ctx.lineWidth = 1;
            ctx.ellipse(cx + 6, cy - r - 5, 6, 3, Math.PI / -4, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();

            // 3. Vẽ thân quả táo tròn trịa (Màu đỏ có viền tối)
            ctx.beginPath();
            ctx.fillStyle = "#d32f2f"; // Màu đỏ thân táo
            ctx.strokeStyle = "#5f0909"; // Viền tối xung quanh
            ctx.lineWidth = 1.5;
            
            // Vẽ hình dáng quả táo lõm nhẹ ở đầu và đít
            ctx.arc(cx - r/3, cy, r * 0.9, 0, 2 * Math.PI);
            ctx.arc(cx + r/3, cy, r * 0.9, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();

            // 4. Vẽ điểm bóng sáng (Vệt màu trắng hồng nhạt bên trái giúp táo căng mọng)
            ctx.beginPath();
            ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
            ctx.arc(cx - r/2, cy - r/3, r/4, 0, 2 * Math.PI);
            ctx.fill();
        }

        function U() {
            let hX = s[0].x, hY = s[0].y;
            if(d=="L") hX-=20; if(d=="U") hY-=20; if(d=="R") hX+=20; if(d=="D") hY+=20;
            if(hX<0 || hX>=400 || hY<0 || hY>=400 || s.some(p=>p.x==hX && p.y==hY)) {
                clearInterval(loop); btn.style.display = "block"; alert("Thua rồi!"); return;
            }
            s.unshift({x: hX, y: hY});
            if(hX==a.x && hY==a.y) { score++; scoreE.innerText = score; T(); } else { s.pop(); }
            
            // Xóa màn hình vẽ lại nền
            ctx.fillStyle = "#111"; ctx.fillRect(0,0,400,400);
            
            // Gọi hàm vẽ quả táo hoạt hình mới
            drawApple(a.x, a.y, 20);
            
            // Vẽ con sâu màu xanh lá
            ctx.fillStyle = "lime"; s.forEach(p => ctx.fillRect(p.x, p.y, 18, 18));
        }
        S();
    </script>
</body>
</html>
